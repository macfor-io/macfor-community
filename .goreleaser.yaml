version: 2

project_name: macfor

before:
  hooks:
    - go mod tidy

builds:
  - id: macfor
    main: ./cmd/macfor
    binary: macfor
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}

universal_binaries:
  - id: macfor-universal
    ids: [macfor]
    replace: false
    name_template: macfor

archives:
  - id: macfor
    name_template: >-
      macfor_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

homebrew_casks:
  - name: macfor
    ids: [macfor]
    binaries: [macfor]
    homepage: https://macfor.io/
    description: Forensic artifact collector
    directory: Casks
    repository:
      owner: macfor-io
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a write deploy key scoped to the tap.
      git:
        url: git@github.com:macfor-io/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    commit_author:
      name: Macfor
      email: macforio@proton.me
    commit_msg_template: "macfor {{ .Tag }}"
    # Prereleases stay out of the tap.
    skip_upload: auto
    caveats: |
      macfor needs Full Disk Access (grant it to your terminal) and usually
      sudo to read protected artifacts.
    hooks:
      post:
        # Release binaries are unsigned; clear quarantine so Gatekeeper
        # doesn't block the first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/macfor"]
          end

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  github:
    owner: macfor-io
    name: macfor-community
  draft: true
  prerelease: auto
  header: |
    ## macfor {{ .Version }}

    Prebuilt binaries below are **unsigned**. macOS will quarantine them on
    first run — remove the quarantine attribute with:

    ```
    xattr -dr com.apple.quarantine ./macfor
    ```

    See [README](https://github.com/macfor-io/macfor-community#readme) for
    installation and usage.
